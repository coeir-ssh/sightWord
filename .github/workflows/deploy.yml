name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/sight-word-learning-app-8SGGz
      - claude/fix-word-progress-auto-advance-jDLwi
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -1

      - name: Install edge-tts
        # Pin a version known to expose `Communicate.texts` — the letter-MP3
        # generator overrides that attribute to inject SSML <say-as> markup
        # directly into edge-tts's wrapped envelope. A future edge-tts
        # release could rename or remove `texts` and silently break the
        # letter audio (the rest still works, so the deploy stays "green"
        # while the letter cues degrade). The script also asserts that the
        # attribute exists and errors out if not, but pinning prevents the
        # accidental upgrade.
        run: pip install 'edge-tts==7.2.8'

      - name: Generate audio + manifest
        run: python scripts/generate-audio.py

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: SPA 404 fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
